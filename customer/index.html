<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan & Serve</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <main class="mx-auto max-w-3xl p-4 space-y-4">
    <header class="flex justify-between items-center">
      <h1 class="text-2xl font-bold">Scan & Serve</h1>
      <a class="text-sm text-blue-600" href="./track.html">Track order</a>
    </header>
    <section class="rounded-xl bg-white p-4 shadow">
      <p class="text-sm" id="table-meta"></p>
    </section>
    <section class="rounded-xl bg-white p-4 shadow">
      <h2 class="font-semibold mb-2">Menu</h2>
      <div id="menu-list" class="space-y-2"></div>
    </section>
    <section class="rounded-xl bg-white p-4 shadow">
      <h2 class="font-semibold mb-2">Cart</h2>
      <div id="cart-list" class="space-y-2"></div>
      <div class="mt-3 flex items-center gap-2">
        <label class="text-sm" for="tip-percent">Tip %</label>
        <input class="w-20 rounded border p-1" id="tip-percent" type="number" min="0" step="1" value="0" />
      </div>
      <pre id="totals" class="mt-3 text-sm"></pre>
      <button id="checkout-btn" class="mt-2 rounded bg-black text-white px-3 py-2 text-sm">Checkout</button>
      <p id="checkout-status" class="mt-2 text-sm"></p>
    </section>
  </main>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
