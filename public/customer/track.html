<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order status</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 p-6">
  <div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold text-slate-900">Your order</h1>
    <div id="orderId" class="text-xs text-slate-500 mt-1"></div>
    <div id="status" class="mt-6 bg-white rounded-2xl border border-slate-200 p-6 text-center">Loading…</div>
    <a href="/customer/bill.html" class="mt-4 block text-center bg-slate-900 text-white py-3 rounded-xl font-semibold">View bill</a>
    <a href="/customer/menu.html" class="mt-2 block text-center text-slate-600 text-sm">Order more items</a>
  </div>
  <script type="module">
    import { subscribeOrder, STATUS_LABELS, STATUS_FLOW } from "/shared/track.js";
    import { getLastOrderId } from "/shared/state.js";

    const params = new URLSearchParams(location.search);
    const id = params.get("id") || getLastOrderId();
    document.getElementById("orderId").textContent = id ? `Order #${id}` : "";
    if (!id) { document.getElementById("status").textContent = "No order found."; }
    else {
      subscribeOrder(id, ({ local, order }) => {
        const el = document.getElementById("status");
        if (local) {
          el.innerHTML = `<div class="text-amber-700">Saved offline. Status updates resume when you reconnect.</div>
            <div class="mt-2 font-semibold">${STATUS_LABELS.new}</div>`;
          return;
        }
        if (!order) { el.textContent = "Order not found."; return; }
        const status = order.status || "new";
        const idx = STATUS_FLOW.indexOf(status);
        el.innerHTML = `
          <div class="text-3xl font-bold text-slate-900">${STATUS_LABELS[status] || status}</div>
          <div class="mt-4 flex justify-between text-xs text-slate-500">
            ${STATUS_FLOW.map((s, i) => `<div class="${i <= idx ? 'text-emerald-600 font-semibold' : ''}">${STATUS_LABELS[s]}</div>`).join("")}
          </div>
          ${order.display_number ? `<div class="mt-4 text-sm text-slate-500">Number #${order.display_number}</div>` : ""}`;
      });
    }
  </script>
</body>
</html>
